# Pubblica il sito su Infomaniak a ogni push su main: FTPS, solo i file cambiati.
# Va online solo la cartella site/, con il core comune (repository privato mapcore) copiato in site/core/.
# Secrets del repository: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (utente FTP limitato a /sites/winetripmap.com)
# e MAPCORE_DEPLOY_KEY (chiave privata della deploy key in sola lettura del repository mapcore).
# Non cancella mai database, configurazioni con password, foto caricate e contatori:
# sono esclusi qui sotto, e quello che è escluso non viene né caricato né cancellato.
name: Deploy su Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch: # per rilanciarlo a mano da GitHub (Actions → Deploy su Infomaniak → Run workflow)

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # versioni fissate al commit esatto: nessuno può cambiare il codice che riceve la password FTP
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scarica il core comune
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: weberone/mapcore
          ssh-key: ${{ secrets.MAPCORE_DEPLOY_KEY }}
          path: _mapcore
          persist-credentials: false

      # In sviluppo site/core è un link simbolico a ../MAPCORE; online diventa una copia vera.
      # Gli strumenti (tools/) e le note (CLAUDE.md) del core non vanno online.
      - name: Metti il core nel sito
        run: |
          set -euo pipefail
          rm -rf site/core
          mkdir site/core
          rsync -a --exclude '.git*' --exclude CLAUDE.md --exclude tools/ _mapcore/ site/core/

      # Online va il JavaScript compresso e con i nomi interni rimescolati (più leggero e difficile da copiare);
      # nel repository resta leggibile. Se la compressione fallisce, il deploy si ferma e online non cambia niente.
      # un errore di sintassi in un file PHP non va online (sul Mac non c'è PHP per provarlo)
      - name: Controlla i file PHP
        run: |
          set -e
          find site -name '*.php' -not -path 'site/core/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Comprimi il JavaScript
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/terser" --no-save --silent terser@5.51.2
          T="$RUNNER_TEMP/terser/node_modules/.bin/terser"
          find site -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do
            "$T" "$f" --compress --mangle --ecma 2020 -o "$f"
          done

      # Online HTML e CSS arrivano senza commenti (anche quelli HTML nelle pagine PHP); nel repository restano.
      - name: Togli i commenti da HTML e CSS
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/strip" --no-save --silent html-minifier-terser@7.2.0 clean-css@5.3.3
          find site -type f \( -name '*.html' -o -name '*.css' -o -name '*.php' \) -print0 \
            | xargs -0 -r node _mapcore/tools/strip-comments.mjs "$RUNNER_TEMP/strip/node_modules"

      - name: Carica via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ./ # l'utente FTP dedicato parte già da /sites/winetripmap.com
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/CLAUDE.md
            **/config.php
            **/*.sqlite
            **/*.sqlite3
            **/*.db
            **/*-wal
            **/*-shm
            **/*.log
            uploads/**
            counter/**
            private/**
